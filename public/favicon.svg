      <stop offset="0%" stop-color="#FF5E97" />
      <stop offset="50%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#D92672" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#EC4899" flood-opacity="0.45" />
